services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 40
  app:
    image: todo-health-test:local
    environment:
      DATABASE_URL: postgresql://postgres:test-only@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
