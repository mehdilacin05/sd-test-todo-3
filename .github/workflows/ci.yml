# Ziel: .github/workflows/ci.yml. Regeln: Skill software-projekt, wissen/cicd.md. Wörtlich übernehmen.
# Werkzeuge per Release-Binärdatei mit geprüfter Prüfsumme (amd64 und arm64), nie per go install oder Setup-Action.
# PR: check → image (Build + Trivy). main: zusätzlich publish (sha-<commit> + staging) → staging-e2e.
# Job-Namen `check` und `image` sind Pflicht-Checks im Ruleset: nicht umbenennen.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # Commit-Stage: Ziel unter 5 Minuten
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks prüft die ganze Historie
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # kein .nvmrc im Repo
          cache: npm
      - name: gitleaks (Release + Prüfsumme)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$(uname -m)" in x86_64) a=x64 ;; aarch64) a=arm64 ;; *) echo "::error::$(uname -m)"; exit 1 ;; esac
          u="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          f="gitleaks_${GITLEAKS_VERSION}_linux_${a}.tar.gz"
          cd "$RUNNER_TEMP" && curl -fsSLO "$u/$f" && curl -fsSLO "$u/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - run: make check # secrets, format, lint, typecheck, test (frische Test-DB mit Migrationen + Seed)
      - run: make audit

  image:
    needs: check
    runs-on: ubuntu-24.04-arm # Server ist ARM
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (genau einmal, als OCI-Verzeichnis)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=/tmp/oci,tar=false
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy installieren (Release + Prüfsumme; die Setup-Action scheitert auf ARM ohne Cache)
        env:
          TRIVY_VERSION: 0.70.0
        run: |
          case "$(uname -m)" in x86_64) a=64bit ;; aarch64) a=ARM64 ;; *) echo "::error::$(uname -m)"; exit 1 ;; esac
          u="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          f="trivy_${TRIVY_VERSION}_Linux-${a}.tar.gz"
          cd "$RUNNER_TEMP" && curl -fsSLO "$u/$f" && curl -fsSLO "$u/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $f\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$f" trivy && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Trivy (Abbruch bei CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          input: /tmp/oci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Artefakt für publish (nur main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: /tmp/oci
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      pull-requests: read
    steps:
      # Kein Checkout: der Job mit Schreibrecht führt keinen Repo-Code aus.
      - name: Nur Commits aus einem PR, den ein Mensch gemergt hat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=""
          for _ in 1 2 3 4 5 6; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
            [ -n "$pr" ] && break
            sleep 10
          done
          [ -n "$pr" ] || { echo "::error::$GITHUB_SHA stammt aus keinem PR"; exit 1; }
          by=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged_by.type')
          [ "$by" = "User" ] || { echo "::error::PR #$pr nicht von einem Menschen gemergt ($by)"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: /tmp/oci
      - name: Push nach GHCR (sha-<commit> und staging, gleicher Digest)
        env:
          TOKEN: ${{ github.token }}
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/auth.json"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests oci:/tmp/oci "docker://$IMAGE:sha-$GITHUB_SHA"
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:sha-$GITHUB_SHA")
          skopeo copy --all --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:staging"
          echo "staging = sha-$GITHUB_SHA ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"

  staging-e2e:
    if: github.event_name == 'push' && vars.STAGING_URL != ''
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BASE_URL: ${{ vars.STAGING_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }} # Testnutzer nur auf Staging, keine echten Daten
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # kein .nvmrc im Repo
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Warten, bis Staging diesen Commit meldet (Watchtower zieht selbst)
        run: |
          for _ in $(seq 60); do
            curl -fsS "$BASE_URL/health" | grep -q "$GITHUB_SHA" && exit 0
            sleep 10
          done
          echo "::error::Staging meldet $GITHUB_SHA nach 10 min nicht"; exit 1
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
